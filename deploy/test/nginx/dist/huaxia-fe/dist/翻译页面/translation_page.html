<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 翻译</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- 引入外部CSS文件 -->
  <link rel="stylesheet" crossorigin href="/assets/translate-nb1iTsbz.css">
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">

    <!-- 主内容区 -->
    <main class="flex-1 overflow-hidden flex">
        <!-- 翻译区域 -->
        <div class="flex-1 overflow-hidden flex flex-col">
            <!-- 翻译设置区 -->
            <div class="bg-white border-b border-gray-200 p-4">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-3 text-gray-400">
                        <button class="hover:text-gray-600 transition-colors" title="上一步">
                            <i class="fa fa-undo"></i>
                        </button>
                        <button class="hover:text-gray-600 transition-colors" title="下一步">
                            <i class="fa fa-repeat"></i>
                        </button>
                    </div>
                    <div class="flex-1 flex items-center justify-center space-x-4">
                        <span id="srcLang" class="text-sm font-medium text-gray-700">中文</span>
                        <button id="langExchangeBtn" class="text-gray-500 hover:text-primary transition-colors">
                            <i class="fa fa-exchange"></i>
                        </button>
                        <span id="dstLang" class="text-sm font-medium text-gray-700">英文</span>
                    </div>
                    <div class="flex items-center space-x-2 ml-4">
                        <!-- 术语库选择按钮 -->
                        <div class="relative">
                            <button id="terminologySelectBtn" class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="术语库选择">
                                <i class="fa fa-book"></i>
                            </button>
                            <!-- 术语库选择下拉菜单 -->
                            <ul id="terminologySelectMenu" class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md py-1 hidden z-10 border border-gray-200">
                                <!-- 动态加载术语库列表 -->
                            </ul>
                        </div>
                        <!-- 模板选择按钮 -->
                        <div class="relative">
                            <button id="templateSelectBtn" class="p-2 text-gray-500 opacity-50 cursor-not-allowed" disabled title="模板选择（已禁用）">
                                <i class="fa fa-file-text-o"></i>
                            </button>
                            <!-- 模板选择下拉菜单 -->
                            <ul id="templateSelectMenu" class="absolute right-0 mt-2 w-64 bg-white shadow-lg rounded-md py-1 hidden z-10 border border-gray-200">
                                <li class="px-4 py-2 text-sm font-medium text-primary font-bold">六大板块</li>
                                <li class="template-item" data-id="school"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">思想流派</a></li>
                                <li class="template-item" data-id="poetry"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">诗词歌赋</a></li>
                                <li class="template-item" data-id="music"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">民俗音乐</a></li>
                                <li class="template-item" data-id="heritage"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">非遗传承</a></li>
                                <li class="template-item" data-id="food"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">饮食文化</a></li>
                                <li class="template-item" data-id="festival"><a href="#" class="block px-4 py-2 text-sm text-gray-800 hover:bg-gray-100">传统节日</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 文本输入输出区 - 占据更多空间 -->
            <div class="flex-1 overflow-hidden flex flex-col md:flex-row">
                <!-- 左侧输入框 -->
                <div class="w-full md:w-1/2 h-full bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col">
                    <div class="flex-1 overflow-auto p-6">
                        <textarea 
                            id="srcText"
                            class="w-full h-full border-0 focus:ring-0 resize-none text-base placeholder-gray-400"
                            placeholder="输入要翻译的文本或网址"
                            rows="8"
                        ></textarea>
                    </div>
                    <div class="border-t border-gray-200 p-3 flex items-center justify-between h-14">
                        <div class="flex items-center space-x-4">
                            <button class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="导入文档">
                                <i class="fa fa-upload"></i>
                            </button>
                            <button class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="历史记录">
                                <i class="fa fa-history"></i>
                            </button>
                            <button class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="一键清除">
                                <i class="fa fa-eraser"></i>
                            </button>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-sm text-gray-500 flex items-center">
                                0/5000
                            </div>
                            <button 
                                id="btnTranslate"
                                class="bg-primary hover:bg-primary/90 text-white text-sm px-4 py-1.5 rounded-md transition-colors">
                                翻译
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右侧输出框 -->
                <div class="w-full md:w-1/2 h-full bg-light flex flex-col">
                    <div class="flex-1 p-6 overflow-y-auto">
                        <textarea 
                            id="dstText"
                            class="w-full h-full border-0 focus:ring-0 resize-none text-base placeholder-gray-400 bg-transparent" 
                            placeholder="翻译结果将显示在这里" 
                            rows="8"
                        ></textarea>
                    </div>
                    <div class="border-t border-gray-200 p-3 flex items-center justify-between h-14">
                        <div class="flex items-center space-x-4">
                            <button class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="复制文本">
                                <i class="fa fa-copy"></i>
                            </button>
                            <button class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="收藏">
                                <i class="fa fa-star-o"></i>
                            </button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="加粗">
                                <i class="fa fa-bold"></i>
                            </button>
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="斜体">
                                <i class="fa fa-italic"></i>
                            </button>
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="下划线">
                                <i class="fa fa-underline"></i>
                            </button>
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="颜色高亮">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="字体大小">
                                <i class="fa fa-font"></i>
                            </button>
                            <button class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="下载导出">
                                <i class="fa fa-download"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        
         <!-- AI助手侧边栏 -->
<aside class="hidden md:flex w-64 lg:w-80 bg-white border-l border-gray-200 overflow-hidden flex-col transition-all duration-300">
  <div class="p-4 border-b border-gray-200 flex items-center justify-between">
    <h3 class="font-medium text-gray-800">AI助手</h3>
    <button class="text-gray-500 hover:text-primary p-1 rounded" title="设置">
      <i class="fa fa-cog"></i>
    </button>
  </div>

  <!-- 会话区 -->
  <div id="aiChatList" class="flex-1 overflow-y-auto p-4 space-y-3 output-scrollbar">
    <div class="bg-primary/10 p-3 rounded-lg">
      <p class="text-sm text-gray-800">您好，我是华夏译典通AI翻译助手。有什么我可以帮您的吗？</p>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="border-t border-gray-200 p-3">
    <div class="flex items-center space-x-2">
      <input
        id="aiInput"
        type="text"
        class="flex-1 border border-gray-300 rounded-full py-2 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50"
        placeholder="向AI助手提问..."
      >
      <button id="aiSendBtn" class="bg-primary hover:bg-primary/90 text-white p-2 rounded-full transition-colors" title="发送">
        <i class="fa fa-paper-plane"></i>
      </button>
    </div>
    <div id="aiTip" class="mt-1 text-xs text-gray-500"></div>
  </div>
</aside>

</main>   <!-- ★ 必须有这一行！把主内容区关掉 ★ -->

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-xs text-gray-500">
        <div class="flex flex-col md:flex-row justify-between items-center">
            <div class="mb-2 md:mb-0">
                <a href="#" class="hover:text-primary">关于我们</a> | 
                <a href="#" class="hover:text-primary">联系我们</a> | 
                <a href="#" class="hover:text-primary">使用条款</a> | 
                <a href="#" class="hover:text-primary">隐私政策</a>
            </div>
            <div>
                © 2025 华夏译典通 版权所有
            </div>
        </div>
    </footer>

    <!-- 引入外部JavaScript文件 -->
     <script>
    // 开发阶段本地测试用（学长拿到代码只要改这行）
    window.API_BASE = 'http://127.0.0.1:19200'; // <-- 学长可换为网关域名
    </script>
     <script src="/common-auth.js"></script>
     <script src="/common-api.js"></script>
    <script src="/翻译页面/script.js"></script>
</body>
</html>
