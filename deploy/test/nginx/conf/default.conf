upstream huaxia-gateway {
    server huaxia-gateway:19200;
}

server {
    listen 80;
    server_name 106.53.26.235 huaxiayidiantong.com www.huaxiayidiantong.com;

    # 前端静态文件
    location / {
        root /home/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # 添加缓存控制
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1M;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 支持各功能模块的子目录访问
    location ~ ^/(思想流派|诗词歌赋|民俗音乐|非遗传承|饮食文化|传统节日|mainpage|terminology_management|翻译页面)/ {
        root /home/dist;
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # API代理
    location /api/ {
        proxy_pass http://huaxia-gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户服务
    location /user/ {
        proxy_pass http://huaxia-gateway/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 术语服务
    location /term/ {
        proxy_pass http://huaxia-gateway/term/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 翻译服务
    location /translate/ {
        proxy_pass http://huaxia-gateway/translate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 助手服务
    location /assistant/ {
        proxy_pass http://huaxia-gateway/assistant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}