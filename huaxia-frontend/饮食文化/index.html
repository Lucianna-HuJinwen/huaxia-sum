<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 饮食文化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="/common-auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                        // 朱砂红/赤色背景
                        vermilion: "#9D2933",
                        // 深褐色
                        "deep-brown": "#3D1E15",
                        // 牙白
                        ivory: "#F8F4E6",
                        // 青绿色
                        teal: "#00A680",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        xingshu: ['"Ma Shan Zheng"', 'cursive'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow-sm {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
            .transition-smooth {
                transition: all 0.3s ease;
            }
            .hover-lift {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
    <style>
        /* 页面特定样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333333;
        }
        
        /* 自定义输入框样式 */
        .custom-input {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #e63e34;
            box-shadow: 0 0 0 3px rgba(230, 62, 52, 0.1);
        }
        
        /* 自定义按钮样式 */
        .custom-button {
            background-color: #e63e34;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .custom-button:hover {
            background-color: #d43832;
        }
    </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">
    <header class="bg-white border-b border-gray-200 h-14 flex items-center px-4 sticky top-0 z-30">
        <div class="flex items-center space-x-4">
            <button class="text-gray-600 hover:text-primary" onclick="window.location.href='../index.html'">
                <i class="fa fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold text-[#3D1E15]">饮食文化</h1>
        </div>
        <div class="ml-auto flex items-center space-x-4">
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="新建模板">
                <i class="fa fa-plus text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="删除模板">
                <i class="fa fa-trash text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="编辑模板">
                <i class="fa fa-pencil text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="保存模板">
                <i class="fa fa-save text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">原文概述</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">菜系</label>
                            <input type="text" class="custom-input" value="川菜" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">来源/传承/地域</label>
                            <input type="text" class="custom-input" value="中国西南地区" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文本类型
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('textTypeOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="textTypeInput" class="custom-input" value="食谱说明" placeholder="请输入...">
                            <div id="textTypeOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '食谱食材')">食谱食材</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '饮食习俗')">饮食习俗</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '美食风味')">美食风味</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文风
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('writingStyleOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="writingStyleInput" class="custom-input" value="通俗易懂" placeholder="请输入...">
                            <div id="writingStyleOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '通俗易懂')">通俗易懂</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '地道鲜活')">地道鲜活</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '细致说明')">细致说明</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '专业规范')">专业规范</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">翻译任务</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">目的</label>
                            <input type="text" class="custom-input" value="饮食文化传播" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">应用场景</label>
                            <input type="text" class="custom-input" value="美食指南" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译者角色</label>
                            <input type="text" class="custom-input" value="美食文化翻译" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                目标受众
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('audienceOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="audienceInput" class="custom-input" value="美食爱好者" placeholder="请输入...">
                            <div id="audienceOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '美食爱好者')">美食爱好者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '饮食文化研究者')">饮食文化研究者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '国际游客')">国际游客</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">译文要求</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译文体裁</label>
                            <input type="text" class="custom-input" value="美食指南" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">定义风格</label>
                            <input type="text" class="custom-input" value="地道鲜活" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">特殊要求</label>
                            <textarea class="custom-input" rows="3" placeholder="请输入...">保留中国饮食文化的特色和烹饪细节；语言通俗易懂，生动有趣；注意食材和烹饪方法的准确翻译；传达中华饮食文化的精髓和背后的故事</textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex justify-center">
                <button id="goToTranslateBtn" class="px-8 py-3 bg-primary hover:bg-primary/90 text-white rounded-md transition-colors">
                    前往翻译
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-xs text-gray-500">
        <div class="flex justify-center">
            © 2025 华夏译典通 版权所有
        </div>
    </footer>

    <script>
        // 1. 页面加载监听 (增强：添加板块标记 + Mock Token)
        document.addEventListener('DOMContentLoaded', function() {
            // 【核心修复】标记来源，用于翻译页面返回时识别
            console.log('进入板块：饮食文化');
            localStorage.setItem('selectedCategory', '饮食文化'); 
            
            // 绑定按钮事件
            const goToTranslateBtn = document.getElementById('goToTranslateBtn');
            if (goToTranslateBtn) {
                goToTranslateBtn.addEventListener('click', goToTranslate);
                console.log('饮食文化页面前往翻译按钮事件已绑定');
            }

            // 模拟登录 (测试环境防止跳转)
            const token = localStorage.getItem('hxytt_token');
            if (!token) {
                console.warn('测试环境：自动注入模拟Token');
                localStorage.setItem('hxytt_token', 'mock-token');
            }
        });

        // 2. 折叠/展开功能 (原样保留)
        function toggleCollapse(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const isHidden = element.classList.contains('hidden');
                if (isHidden) {
                    element.classList.remove('hidden');
                    // 更新图标方向
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-down');
                        button.classList.add('fa-chevron-up');
                    }
                } else {
                    element.classList.add('hidden');
                    // 更新图标方向
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-up');
                        button.classList.add('fa-chevron-down');
                    }
                }
            }
        }

        // 3. 选择选项功能 (原样保留，这是您原本的逻辑)
        function selectOption(type, value) {
            let inputId;
            switch(type) {
                case 'textType':
                    inputId = 'textTypeInput';
                    break;
                case 'writingStyle':
                    inputId = 'writingStyleInput';
                    break;
                case 'audience':
                    inputId = 'audienceInput';
                    break;
                default:
                    console.error('未知的选项类型:', type);
                    return;
            }
            
            const input = document.getElementById(inputId);
            if (input) {
                input.value = value;
                // 添加一个短暂的视觉反馈
                input.style.borderColor = '#e63e34';
                input.style.boxShadow = '0 0 0 3px rgba(230, 62, 52, 0.1)';
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.style.boxShadow = '';
                }, 500);
            } else {
                console.error('未找到输入框:', inputId);
            }
        }

        // 4. 前往翻译功能 (增强：添加 Mock 兜底)
        async function goToTranslate() {
            const goToTranslateBtn = document.getElementById('goToTranslateBtn');
            if (!goToTranslateBtn) return;

            try {
                // 显示加载状态
                goToTranslateBtn.disabled = true;
                goToTranslateBtn.textContent = '创建模板中...';
                goToTranslateBtn.classList.add('opacity-50');

                // 获取表单数据
                const templateData = {
                    templateName: `饮食文化模板_${Date.now()}`,
                    era: document.querySelector('input[value="川菜"]')?.value || '',
                    author: document.querySelector('input[value="中国西南地区"]')?.value || '',
                    textType: document.getElementById('textTypeInput')?.value || '',
                    style: document.getElementById('writingStyleInput')?.value || '',
                    // ... 保持原有字段收集逻辑
                };

                // 尝试调用后端
                const token = localStorage.getItem('hxytt_token');
                const response = await fetch('/api/template/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify(templateData)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.code === 1000) {
                        localStorage.setItem('templateId_饮食文化', result.data);
                        window.location.href = '../翻译页面/translation_page.html';
                        return;
                    }
                }
                throw new Error('API请求失败');

            } catch (error) {
                console.warn('后端不可用，启用模拟跳转:', error);
                
                // 【核心修复】前端模拟跳转逻辑
                setTimeout(() => {
                    localStorage.setItem('templateId_饮食文化', 'mock-template-id-yinshi');
                    window.location.href = '../翻译页面/translation_page.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
