<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 思想流派</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="/common-auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                        // 朱砂红/赤色背景
                        vermilion: "#9D2933",
                        // 深褐色
                        "deep-brown": "#3D1E15",
                        // 牙白
                        ivory: "#F8F4E6",
                        // 青绿色
                        teal: "#00A680",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        xingshu: ['"Ma Shan Zheng"', 'cursive'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow-sm {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
            .transition-smooth {
                transition: all 0.3s ease;
            }
            .hover-lift {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
    <style>
        /* 页面特定样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333333;
        }
        
        /* 自定义输入框样式 */
        .custom-input {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #e63e34;
            box-shadow: 0 0 0 3px rgba(230, 62, 52, 0.1);
        }
        
        /* 自定义按钮样式 */
        .custom-button {
            background-color: #e63e34;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .custom-button:hover {
            background-color: #d43832;
        }
    </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">
    <header class="bg-white border-b border-gray-200 h-14 flex items-center px-4 sticky top-0 z-30">
        <div class="flex items-center space-x-4">
            <button class="text-gray-600 hover:text-primary" onclick="window.location.href='../index.html'">
                <i class="fa fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold text-[#3D1E15]">思想流派</h1>
        </div>
        <div class="ml-auto flex items-center space-x-4">
            <button class="p-2 text-[#3D1E15] hover:text-[#9D2933] rounded-full hover:bg-gray-50 transition-all duration-300" title="新建模板">
                <i class="fa fa-plus text-lg"></i>
            </button>
            <button class="p-2 text-[#3D1E15] hover:text-[#9D2933] rounded-full hover:bg-gray-50 transition-all duration-300" title="删除模板">
                <i class="fa fa-trash text-lg"></i>
            </button>
            <button class="p-2 text-[#3D1E15] hover:text-[#9D2933] rounded-full hover:bg-gray-50 transition-all duration-300" title="编辑模板">
                <i class="fa fa-pencil text-lg"></i>
            </button>
            <button class="p-2 text-[#3D1E15] hover:text-[#9D2933] rounded-full hover:bg-gray-50 transition-all duration-300" title="保存模板">
                <i class="fa fa-save text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">原文概述</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">思想流派/学派</label>
                            <input type="text" class="custom-input" value="儒家思想" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">代表人物/著作</label>
                            <input type="text" class="custom-input" value="孔子、《论语》" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文本类型
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('textTypeOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="textTypeInput" class="custom-input" value="经" placeholder="请输入...">
                            <div id="textTypeOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '经')">经</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '史')">史</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '子')">子</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '集')">集</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文风
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('writingStyleOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="writingStyleInput" class="custom-input" value="学术严谨" placeholder="请输入...">
                            <div id="writingStyleOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '微言大义')">微言大义</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '秉笔直书')">秉笔直书</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '委婉含蓄')">委婉含蓄</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '沉郁顿挫')">沉郁顿挫</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">翻译任务</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">目的</label>
                            <input type="text" class="custom-input" value="学术研究参考" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">应用场景</label>
                            <input type="text" class="custom-input" value="学术出版物" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译者角色</label>
                            <input type="text" class="custom-input" value="哲学翻译专家" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                目标受众
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('audienceOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" class="custom-input" value="哲学研究者" placeholder="请输入...">
                            <div id="audienceOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '专业学者')">专业学者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '大众读者')">大众读者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '文化爱好者')">文化爱好者</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">译文要求</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译文体裁</label>
                            <input type="text" class="custom-input" value="学术论文" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">定义风格</label>
                            <input type="text" class="custom-input" value="学术严谨" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">特殊要求</label>
                            <textarea class="custom-input" rows="3" placeholder="请输入...">保留思想流派的核心概念准确性，同时传达中国传统哲学的思想内涵；语言流畅自然，符合目标受众的阅读习惯</textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex justify-center">
                <button id="goToTranslateBtn" class="px-8 py-3 bg-primary hover:bg-primary/90 text-white rounded-md transition-colors">
                    前往翻译
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-xs text-gray-500">
        <div class="flex justify-center">
            © 2025 华夏译典通 版权所有
        </div>
    </footer>

    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 【核心修复】标记来源
            console.log('进入板块：思想流派');
            localStorage.setItem('selectedCategory', '思想流派'); 
            
            // 绑定按钮
            const saveButton = document.querySelector('button[title="保存模板"]');
            if (saveButton) saveButton.addEventListener('click', saveTemplate);

            const goToTranslateBtn = document.getElementById('goToTranslateBtn');
            if (goToTranslateBtn) goToTranslateBtn.addEventListener('click', goToTranslate);

            // Mock Token
            if (!localStorage.getItem('hxytt_token')) {
                localStorage.setItem('hxytt_token', 'mock-token');
            }

            // 【核心修复】启用标签自动绑定（解决无ID无法点击的问题）
            initTagSelection();
        });

        // 通用标签选择功能 (自动寻找输入框)
        function initTagSelection() {
            const optionContainers = document.querySelectorAll('[id$="Options"]');
            optionContainers.forEach(container => {
                const input = container.previousElementSibling;
                // 确保前面是一个输入框 (Label -> Input -> Div结构)
                if (input && (input.tagName === 'INPUT' || input.classList.contains('custom-input'))) {
                    const tags = container.querySelectorAll('span');
                    tags.forEach(tag => {
                        tag.addEventListener('click', function() {
                            input.value = this.innerText.trim();
                            // 视觉反馈
                            input.style.borderColor = '#e63e34';
                            setTimeout(() => input.style.borderColor = '', 300);
                            // 选完折叠
                            toggleCollapse(container.id);
                        });
                    });
                }
            });
        }

        // 折叠/展开功能 (保留)
        function toggleCollapse(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const isHidden = element.classList.contains('hidden');
                if (isHidden) {
                    element.classList.remove('hidden');
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-down');
                        button.classList.add('fa-chevron-up');
                    }
                } else {
                    element.classList.add('hidden');
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-up');
                        button.classList.add('fa-chevron-down');
                    }
                }
            }
        }

        // 保留原 selectOption 以防兼容性问题，但主要依靠 initTagSelection
        function selectOption(type, value) {
            // 此函数保留为空或仅做简单日志，实际逻辑已由 initTagSelection 接管
            // 避免原来 HTML 中的 onclick 报错
            console.log('Legacy selectOption called:', type, value);
        }

        // 保存模板功能
        async function saveTemplate() {
            alert('模板保存功能已触发 (测试模式)');
        }

        // 前往翻译功能 (含 Mock)
        async function goToTranslate() {
            const btn = document.getElementById('goToTranslateBtn');
            if (!btn) return;

            btn.disabled = true;
            btn.textContent = '创建模板中...';
            btn.classList.add('opacity-50');

            try {
                // 真实请求尝试
                const templateData = {
                    templateName: `思想流派模板_${Date.now()}`,
                    // 尝试获取部分字段，保持兼容
                    textType: document.getElementById('textTypeInput')?.value || '',
                    style: document.getElementById('writingStyleInput')?.value || ''
                };

                const token = localStorage.getItem('hxytt_token');
                const response = await fetch('/api/template/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify(templateData)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.code === 1000) {
                        localStorage.setItem('templateId_思想流派', result.data);
                        window.location.href = '../翻译页面/translation_page.html';
                        return;
                    }
                }
                throw new Error('API Error');

            } catch (error) {
                console.warn('后端不可用，启用模拟跳转:', error);
                
                // 【核心修复】模拟跳转
                setTimeout(() => {
                    localStorage.setItem('templateId_思想流派', 'mock-template-id-sixiang');
                    window.location.href = '../翻译页面/translation_page.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
