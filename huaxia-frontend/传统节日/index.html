<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 传统节日</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="/common-auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                        // 朱砂红/赤色背景
                        vermilion: "#9D2933",
                        // 深褐色
                        "deep-brown": "#3D1E15",
                        // 牙白
                        ivory: "#F8F4E6",
                        // 青绿色
                        teal: "#00A680",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        xingshu: ['"Ma Shan Zheng"', 'cursive'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow-sm {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
            .transition-smooth {
                transition: all 0.3s ease;
            }
            .hover-lift {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
    <style>
        /* 页面特定样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333333;
        }
        
        /* 自定义输入框样式 */
        .custom-input {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #e63e34;
            box-shadow: 0 0 0 3px rgba(230, 62, 52, 0.1);
        }
        
        /* 自定义按钮样式 */
        .custom-button {
            background-color: #e63e34;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .custom-button:hover {
            background-color: #d43832;
        }
    </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">
    <header class="bg-white border-b border-gray-200 h-14 flex items-center px-4 sticky top-0 z-30">
        <div class="flex items-center space-x-4">
            <button class="text-gray-600 hover:text-primary" onclick="window.location.href='../index.html'">
                <i class="fa fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold text-[#3D1E15]">传统节日</h1>
        </div>
        <div class="ml-auto flex items-center space-x-4">
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="新建模板">
                <i class="fa fa-plus text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="删除模板">
                <i class="fa fa-trash text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="编辑模板">
                <i class="fa fa-pencil text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="保存模板">
                <i class="fa fa-save text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">原文概述</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">节日名称</label>
                            <input type="text" class="custom-input" value="开渔节" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">来源/地域</label>
                            <input type="text" class="custom-input" value="中国东南沿海地区" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文本类型
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('textTypeOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" class="custom-input" value="节日介绍" placeholder="请输入...">
                            <div id="textTypeOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">文旅宣传</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">节庆介绍</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">教育教材</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文风
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('writingStyleOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" class="custom-input" value="热烈生动" placeholder="请输入...">
                            <div id="writingStyleOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">热烈生动</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">文化厚重</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">通俗易懂</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">亲切自然</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">翻译任务</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">目的</label>
                            <input type="text" class="custom-input" value="文化交流与传播" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">应用场景</label>
                            <input type="text" class="custom-input" value="旅游手册" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译者角色</label>
                            <input type="text" class="custom-input" value="文化翻译专家" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                目标受众
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('audienceOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" class="custom-input" value="国际游客" placeholder="请输入...">
                            <div id="audienceOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">国际游客</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">海外华人</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">文化爱好群体</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary">跨文化研究者</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">译文要求</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译文体裁</label>
                            <input type="text" class="custom-input" value="新闻社评" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">定义风格</label>
                            <input type="text" class="custom-input" value="文化厚重" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">特殊要求</label>
                            <textarea class="custom-input" rows="3" placeholder="请输入...">保留中国传统节日的文化内涵和特色；语言通俗易懂，符合目标受众的阅读习惯；注重文化差异的处理，确保译文准确传达节日的文化意义</textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex justify-center">
                <button id="goToTranslateBtn" class="px-8 py-3 bg-primary hover:bg-primary/90 text-white rounded-md transition-colors">
                    前往翻译
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-xs text-gray-500">
        <div class="flex justify-center">
            © 2025 华夏译典通 版权所有
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 标记当前板块 (核心修复：翻译页返回需要)
            console.log('进入板块：传统节日');
            localStorage.setItem('selectedCategory', '传统节日'); 
            
            // 2. 绑定按钮事件
            const btn = document.getElementById('goToTranslateBtn');
            if(btn) btn.addEventListener('click', goToTranslate);
            
            // 3. 初始化标签选择功能 (核心修复：让推荐选项可点击)
            initTagSelection();

            // 4. 模拟登录 (测试环境用)
            if(!localStorage.getItem('hxytt_token')) {
                localStorage.setItem('hxytt_token', 'mock-token');
            }
        });

        // 标签选择逻辑
        function initTagSelection() {
            // 查找所有以 Options 结尾的 div (如 textTypeOptions)
            const optionContainers = document.querySelectorAll('[id$="Options"]');
            optionContainers.forEach(container => {
                // 找到它前面的输入框 (input 标签)
                // 结构通常是: label -> input -> div(options)
                const input = container.previousElementSibling; 
                
                if (input && input.tagName === 'INPUT') {
                    const tags = container.querySelectorAll('span');
                    tags.forEach(tag => {
                        tag.addEventListener('click', function() {
                            // 填入值
                            input.value = this.innerText.trim();
                            // 选完后自动折叠 (体验优化)
                            toggleCollapse(container.id);
                        });
                    });
                }
            });
        }

        // 折叠/展开功能 (保持兼容)
        function toggleCollapse(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const isHidden = element.classList.contains('hidden');
                if (isHidden) {
                    element.classList.remove('hidden');
                    // 尝试更新图标 (适配原HTML结构)
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-down');
                        button.classList.add('fa-chevron-up');
                    }
                } else {
                    element.classList.add('hidden');
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-up');
                        button.classList.add('fa-chevron-down');
                    }
                }
            }
        }

        // 跳转逻辑 (含 Mock)
        async function goToTranslate() {
            const btn = document.getElementById('goToTranslateBtn');
            btn.disabled = true;
            btn.textContent = '创建模板中...';
            btn.classList.add('opacity-50');

            try {
                // 1. 尝试真实请求
                const token = localStorage.getItem('hxytt_token');
                
                // 简单抓取两个字段做示例，不影响其他
                const textType = document.querySelector('input[value="节日介绍"]')?.value || '节日介绍';
                
                const templateData = { 
                    templateName: `传统节日_${Date.now()}`,
                    textType: textType
                }; 
                
                const response = await fetch('/api/template/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify(templateData)
                });

                const result = await response.json();
                if (result.code === 1000) {
                    localStorage.setItem('templateId_传统节日', result.data);
                    window.location.href = '../翻译页面/translation_page.html';
                } else {
                    throw new Error(result.msg);
                }

            } catch (error) {
                console.warn('进入模拟模式:', error);
                // 2. 模拟跳转 (Mock)
                setTimeout(() => {
                    localStorage.setItem('templateId_传统节日', 'mock-template-id-999');
                    window.location.href = '../翻译页面/translation_page.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
