<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 翻译</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // 配置 PDF.js 解析器
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        // 配置 Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', 
                        secondary: '#f5f5f5', 
                        dark: '#333333', 
                        light: '#f9f9f9', 
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">

    <main class="flex-1 overflow-hidden flex">
        <div class="flex-1 overflow-hidden flex flex-col" id="printArea">
            <div class="bg-white border-b border-gray-200 p-4 h-16 flex items-center justify-between z-20 no-print">
                <div class="flex items-center space-x-4">
                    <button id="backBtn" class="text-gray-500 hover:text-primary transition-colors flex items-center px-2" title="返回模板页">
                        <i class="fa fa-arrow-left text-lg"></i>
                    </button>
                    <div class="h-4 w-px bg-gray-300 mx-2"></div>
                    <div class="flex items-center space-x-3 text-gray-500">
                        <button id="btnUndo" class="hover:text-primary" title="撤销"><i class="fa fa-undo"></i></button>
                        <button id="btnRedo" class="hover:text-primary" title="重做"><i class="fa fa-repeat"></i></button>
                    </div>
                </div>

                <div class="flex-1 flex items-center justify-center space-x-4 absolute left-1/2 transform -translate-x-1/2">
                    <span id="srcLang" class="text-sm font-medium text-gray-700">中文</span>
                    <button id="langExchangeBtn" class="text-gray-500 hover:text-primary transition-colors"><i class="fa fa-exchange"></i></button>
                    <span id="dstLang" class="text-sm font-medium text-gray-700">英文</span>
                </div>

                <div class="flex items-center space-x-2">
                    <div class="relative">
                        <button id="terminologySelectBtn" class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="术语库选择">
                            <i class="fa fa-book"></i>
                        </button>
                        <ul id="terminologySelectMenu" class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md py-1 hidden z-30 border border-gray-200 max-h-64 overflow-y-auto"></ul>
                    </div>
                    <button id="templateSelectBtn" class="p-2 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="当前模板">
                        <i class="fa fa-file-text-o"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-hidden flex flex-col md:flex-row min-h-0">
                <div class="w-full md:w-1/2 h-full bg-white border-r border-gray-200 flex flex-col min-h-0 relative">
                    <div class="flex-1 overflow-hidden relative">
                        <div id="srcText" class="w-full h-full p-6 outline-none text-base custom-scrollbar editable-div" contenteditable="true" placeholder="输入要翻译的文本或拖入文档..."></div>
                    </div>
                    <div class="border-t border-gray-200 p-3 flex items-center justify-between h-14 bg-white z-10 shrink-0 no-print">
                        <div class="flex items-center space-x-4">
                            <button id="btnImportDoc" class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="导入文档 (Word/PDF/TXT)"><i class="fa fa-upload"></i></button>
                            <button id="btnHistory" class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="历史记录"><i class="fa fa-history"></i></button>
                            <button id="btnClearAll" class="text-gray-500 hover:text-primary transition-colors p-2 rounded" title="一键清除"><i class="fa fa-eraser"></i></button>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div id="charCount" class="text-sm text-gray-500">0/5000</div>
                            <button id="btnTranslate" class="bg-primary hover:bg-primary/90 text-white text-sm px-4 py-1.5 rounded-md shadow-sm">翻译</button>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/2 h-full bg-light flex flex-col min-h-0 relative">
                    <div class="flex-1 overflow-hidden relative">
                        <div id="dstText" class="w-full h-full p-6 outline-none text-base custom-scrollbar editable-div bg-transparent" contenteditable="true" placeholder="翻译结果将显示在这里"></div>
                    </div>
                    <div class="border-t border-gray-200 p-2 flex items-center justify-between h-14 bg-light z-10 shrink-0 no-print">
                        <div class="flex items-center space-x-1">
                            <button class="text-gray-500 hover:text-primary p-2 rounded" title="复制" id="btnCopy"><i class="fa fa-copy"></i></button>
                            <button class="text-gray-500 hover:text-primary p-2 rounded" title="收藏" id="btnFavorite"><i class="fa fa-star-o"></i></button>
                        </div>
                        
                        <div class="flex items-center space-x-1 border-l border-gray-300 pl-2">
                            <select id="fontSizeSelect" class="text-xs border border-gray-300 rounded px-1 py-1 text-gray-600 focus:outline-none h-8 w-16">
                                <option value="1">极小</option><option value="2">小</option><option value="3" selected>正常</option>
                                <option value="4">中等</option><option value="5">大</option><option value="6">极大</option><option value="7">巨无霸</option>
                            </select>
                            <button class="p-1.5 text-gray-600 hover:bg-gray-200 rounded" onclick="document.execCommand('bold')"><i class="fa fa-bold"></i></button>
                            <button class="p-1.5 text-gray-600 hover:bg-gray-200 rounded" onclick="document.execCommand('italic')"><i class="fa fa-italic"></i></button>
                            <button class="p-1.5 text-gray-600 hover:bg-gray-200 rounded" onclick="document.execCommand('underline')"><i class="fa fa-underline"></i></button>
                            
                            <button class="p-1.5 text-yellow-600 hover:bg-yellow-100 rounded relative" onclick="document.execCommand('backColor',false,'yellow')" title="荧光笔">
                                <i class="fa fa-pencil"></i><span class="absolute bottom-1 right-1 w-2 h-2 bg-yellow-400 rounded-full"></span>
                            </button>
                            <div class="relative w-8 h-8 flex items-center justify-center hover:bg-gray-200 rounded cursor-pointer" title="字体颜色">
                                <label for="colorPicker" class="cursor-pointer w-full h-full flex items-center justify-center"><i class="fa fa-font text-gray-600"></i></label>
                                <input type="color" id="colorPicker" class="absolute opacity-0 w-full h-full cursor-pointer left-0 top-0">
                            </div>
                            
                            <div class="h-4 w-px bg-gray-300 mx-1"></div>

                            <!-- ① 外面加一层，用于控制点击展开 -->
<div class="relative inline-block" id="exportWrapper">

    <!-- 原按钮 -->
    <button id="exportBtn"
            class="p-1.5 text-gray-600 hover:text-primary hover:bg-gray-100 rounded"
            title="导出">
        <i class="fa fa-download"></i>
    </button>

    <!-- ② 删除 group-hover:block，默认隐藏，用 JS 控制 -->
    <div id="exportMenu"
         class="absolute bottom-full right-0 mb-2 w-32 bg-white shadow-lg rounded-md border border-gray-200 hidden">

        <a href="#" id="exportWord" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fa fa-file-word-o mr-2 text-blue-600"></i>导出 Word
        </a>

        <a href="#" id="exportPDF" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fa fa-file-pdf-o mr-2 text-red-600"></i>导出 PDF
        </a>

        <a id="btnSaveToProject"
           class="block px-4 py-2 text-sm text-green-700 hover:bg-green-50 ">
            <i class="fa fa-floppy-o mr-2"></i> 保存并返回项目
        </a>
        
        
    </div>
</div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <aside class="hidden md:flex w-64 lg:w-80 bg-white border-l border-gray-200 flex-col h-full z-30 no-print">
            <div class="h-16 border-b border-gray-200 flex items-center justify-between px-4 shrink-0">
                <h3 class="font-bold text-gray-800">AI助手</h3>
                <button class="text-gray-400 hover:text-gray-600"><i class="fa fa-cog"></i></button>
            </div>
            <div id="aiChatList" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 output-scrollbar">
                <div class="bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                    <p class="text-sm text-gray-800">您好，我是华夏译典通AI翻译助手。有什么我可以帮您的吗？</p>
                </div>
            </div>
            <div class="border-t border-gray-200 p-2 h-14 shrink-0 flex items-center justify-center">
                <div class="flex items-center space-x-2 w-full px-2">
                    <input id="aiInput" type="text" class="flex-1 border rounded-full py-1.5 px-3 text-sm bg-gray-50" placeholder="询问 AI 助手...">
                    <button id="aiSendBtn" class="bg-primary hover:bg-primary/90 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fa fa-paper-plane text-xs"></i></button>
                </div>
            </div>
        </aside>
    </main>

    <input type="file" id="importFileInput" accept=".txt,.html,.md,.docx,.pdf" style="display: none;" />
    
    <div id="historyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-lg w-3/4 lg:w-1/2 h-3/4 flex flex-col shadow-2xl animate-fade-in">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h3 class="font-bold text-gray-700">历史记录</h3>
                <div class="space-x-2">
                    <button id="clearHistoryBtn" class="text-xs text-red-500 underline">清空</button>
                    <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="text-xl">&times;</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="historyList"></div>
        </div>
    </div>
    
    <div id="favoriteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-lg w-3/4 lg:w-1/2 h-3/4 flex flex-col shadow-2xl animate-fade-in">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h3 class="font-bold text-primary">我的收藏</h3>
                <button onclick="document.getElementById('favoriteModal').classList.add('hidden')" class="text-xl">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="favoriteList"></div>
        </div>
    </div>

    <script>window.API_BASE = 'http://127.0.0.1:19200';</script>
    <script src="../common-auth.js"></script>
    <script src="../common-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
