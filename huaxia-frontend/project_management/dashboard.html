<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 项目管理工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#e63e34', dark: '#333333', secondary: '#f5f5f5' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-dark">
    <header class="bg-white border-b border-gray-200 h-16 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center">
            <a href="../index.html" class="text-gray-500 hover:text-primary mr-4"><i class="fa fa-arrow-left"></i> 返回首页</a>
            <h1 class="text-xl font-bold text-[#3D1E15]"><i class="fa fa-sitemap mr-2"></i>项目管理工作台</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs">当前身份: 项目经理</span>
            <button class="bg-primary text-white px-4 py-2 rounded shadow hover:bg-red-700 transition">
                <i class="fa fa-plus mr-1"></i> 新建项目
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-6 flex gap-6">
        <aside class="w-64 bg-white rounded-lg shadow-sm p-4 h-[calc(100vh-100px)]">
            <h2 class="font-bold text-gray-700 mb-4 px-2">我的项目组</h2>
            <ul class="space-y-1">
                <li class="bg-red-50 text-primary border-l-4 border-primary px-3 py-2 cursor-pointer font-medium">
                    <div class="flex justify-between items-center">
                        <span>非遗皮影戏外宣</span>
                        <span class="bg-red-200 text-red-800 text-[10px] px-1 rounded">进行中</span>
                    </div>
                </li>
                <li class="hover:bg-gray-50 px-3 py-2 cursor-pointer text-gray-600">
                    <span>宋词英译选集</span>
                </li>
                <li class="hover:bg-gray-50 px-3 py-2 cursor-pointer text-gray-600">
                    <span>川菜烹饪指南</span>
                </li>
            </ul>
        </aside>

        <main class="flex-1">
            <div class="bg-white p-6 rounded-lg shadow-sm mb-6 border-l-4 border-[#3D1E15]">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-2xl font-bold mb-2">非遗皮影戏外宣项目</h2>
                        <p class="text-gray-500 text-sm mb-4">
                            <i class="fa fa-users mr-1"></i> 成员：王经理(您), 李翻译, 张审校 &nbsp;|&nbsp; 
                            <i class="fa fa-database mr-1"></i> 关联语料库：<span class="text-primary font-bold">非遗专用术语库 v2.0</span>
                        </p>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold text-green-600">65%</div>
                        <div class="text-xs text-gray-400">项目进度</div>
                    </div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-green-600 h-2.5 rounded-full" style="width: 65%"></div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                
                <div class="bg-gray-100 p-4 rounded-lg">
                    <h3 class="font-bold text-gray-700 mb-3 flex items-center">
                        <span class="w-2 h-2 bg-gray-400 rounded-full mr-2"></span>待翻译任务
                    </h3>
                    <div class="bg-white p-4 rounded shadow-sm mb-3 border border-gray-200">
                        <div class="flex justify-between mb-2">
                            <span class="text-sm font-bold">第一章：皮影起源</span>
                            <span class="text-xs text-white bg-blue-500 px-1.5 py-0.5 rounded">李翻译</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">截止: 2025-06-01 | 字数: 1200</p>
                        <button onclick="window.location.href='workbench.html'" class="w-full py-1.5 border border-primary text-primary text-sm rounded hover:bg-red-50 transition">
                            <i class="fa fa-pencil"></i> 进入工作台翻译
                        </button>
                    </div>
                </div>

                <div class="bg-gray-100 p-4 rounded-lg">
                    <h3 class="font-bold text-gray-700 mb-3 flex items-center">
                        <span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>待审校/整合
                    </h3>
                    <div class="bg-white p-4 rounded shadow-sm mb-3 border border-gray-200">
                        <div class="flex justify-between mb-2">
                            <span class="text-sm font-bold">前言：光影艺术</span>
                            <span class="text-xs text-white bg-purple-500 px-1.5 py-0.5 rounded">待审校</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">提交时间: 10分钟前 | 译员: 李翻译</p>
                        <button onclick="window.location.href='workbench.html?mode=review'" class="w-full py-1.5 bg-[#3D1E15] text-white text-sm rounded hover:bg-[#2a150f] transition">
                            <i class="fa fa-check-square-o"></i> 审校与整合
                        </button>
                    </div>
                </div>

                <div class="bg-gray-100 p-4 rounded-lg">
                    <h3 class="font-bold text-gray-700 mb-3 flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>已发布
                    </h3>
                    <div class="bg-white p-4 rounded shadow-sm mb-3 opacity-75">
                        <div class="flex justify-between mb-2">
                            <span class="text-sm font-bold line-through text-gray-400">附录：传承人名单</span>
                            <span class="text-xs text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded">完成</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
