<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏译典通 - 民俗音乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="/common-auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                        // 朱砂红/赤色背景
                        vermilion: "#9D2933",
                        // 深褐色
                        "deep-brown": "#3D1E15",
                        // 牙白
                        ivory: "#F8F4E6",
                        // 青绿色
                        teal: "#00A680",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        xingshu: ['"Ma Shan Zheng"', 'cursive'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow-sm {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            }
            .transition-smooth {
                transition: all 0.3s ease;
            }
            .hover-lift {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
    <style>
        /* 页面特定样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333333;
        }
        
        /* 自定义输入框样式 */
        .custom-input {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #e63e34;
            box-shadow: 0 0 0 3px rgba(230, 62, 52, 0.1);
        }
        
        /* 自定义按钮样式 */
        .custom-button {
            background-color: #e63e34;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .custom-button:hover {
            background-color: #d43832;
        }
    </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col text-dark">
    <header class="bg-white border-b border-gray-200 h-14 flex items-center px-4 sticky top-0 z-30">
        <div class="flex items-center space-x-4">
            <button class="text-gray-600 hover:text-primary" onclick="window.location.href='../index.html'">
                <i class="fa fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold text-[#3D1E15]">民俗音乐</h1>
        </div>
        <div class="ml-auto flex items-center space-x-4">
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="新建模板">
                <i class="fa fa-plus text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="删除模板">
                <i class="fa fa-trash text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="编辑模板">
                <i class="fa fa-pencil text-lg"></i>
            </button>
            <button type="button" class="p-2 text-deep-brown hover:text-vermilion rounded-full hover:bg-gray-50 transition-all duration-300" title="保存模板">
                <i class="fa fa-save text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">原文概述</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">朝代/时期</label>
                            <input type="text" class="custom-input" value="宋代" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">来源/地域</label>
                            <input type="text" class="custom-input" value="长江流域" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                音乐类型
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('textTypeOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="textTypeInput" class="custom-input" value="音乐介绍" placeholder="请输入...">
                            <div id="textTypeOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '劳动号子')">劳动号子</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '传统戏曲')">传统戏曲</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '田间山歌')">田间山歌</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('textType', '街巷小调')">街巷小调</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                文风
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('writingStyleOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="writingStyleInput" class="custom-input" value="生动形象" placeholder="请输入...">
                            <div id="writingStyleOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '高亢奔放')">高亢奔放</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '诗意优美')">诗意优美</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '婉转细腻')">婉转细腻</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '生动活泼')">生动活泼</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('writingStyle', '质朴自然')">质朴自然</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">翻译任务</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">目的</label>
                            <input type="text" class="custom-input" value="文化遗产介绍" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">应用场景</label>
                            <input type="text" class="custom-input" value="旅游宣传材料" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译者角色</label>
                            <input type="text" class="custom-input" value="文化翻译专家" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 flex items-center">
                                目标受众
                                <button class="ml-2 text-xs text-gray-400 hover:text-primary" onclick="toggleCollapse('audienceOptions')">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                            </label>
                            <input type="text" id="audienceInput" class="custom-input" value="国际友人" placeholder="请输入...">
                            <div id="audienceOptions" class="hidden mt-2 bg-gray-50 p-2 rounded-md border border-gray-200">
                                <div class="text-xs text-gray-600 mb-1">推荐选项：</div>
                                <div class="flex flex-wrap gap-1">
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '音乐学者')">音乐学者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '普通听众')">普通听众</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '学生群体')">学生群体</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '国际友人')">国际友人</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '音乐从业者')">音乐从业者</span>
                                    <span class="text-xs px-2 py-1 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary hover:text-primary" onclick="selectOption('audience', '文化爱好者')">文化爱好者</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <h2 class="text-base font-semibold text-gray-800 mb-4">译文要求</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">译文体裁</label>
                            <input type="text" class="custom-input" value="文化手册" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">定义风格</label>
                            <input type="text" class="custom-input" value="生动优美" placeholder="请输入...">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">特殊要求</label>
                            <textarea class="custom-input" rows="3" placeholder="请输入...">保留音乐术语的准确性，同时传达中国传统音乐的文化内涵；语言流畅自然，符合目标受众的阅读习惯</textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex justify-center">
                <button id="goToTranslateBtn" class="px-8 py-3 bg-primary hover:bg-primary/90 text-white rounded-md transition-colors">
                    前往翻译
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-xs text-gray-500">
        <div class="flex justify-center">
            © 2025 华夏译典通 版权所有
        </div>
    </footer>

    <script>
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 【核心修复】标记当前板块，确保翻译页面能正确返回
            console.log('进入板块：民俗音乐');
            localStorage.setItem('selectedCategory', '民俗音乐');

            // 绑定按钮事件
            const goToTranslateBtn = document.getElementById('goToTranslateBtn');
            if (goToTranslateBtn) {
                goToTranslateBtn.addEventListener('click', goToTranslate);
                console.log('民俗音乐页面前往翻译按钮事件已绑定');
            }

            // 【测试模式】模拟 Token (防止因无 Token 导致的其他逻辑报错)
            if (!localStorage.getItem('hxytt_token')) {
                console.warn('测试环境：注入模拟Token');
                localStorage.setItem('hxytt_token', 'mock-token');
            }
        });

        // 折叠/展开功能 (保持原逻辑)
        function toggleCollapse(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const isHidden = element.classList.contains('hidden');
                if (isHidden) {
                    element.classList.remove('hidden');
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-down');
                        button.classList.add('fa-chevron-up');
                    }
                } else {
                    element.classList.add('hidden');
                    const button = element.previousElementSibling.previousElementSibling.querySelector('i');
                    if (button) {
                        button.classList.remove('fa-chevron-up');
                        button.classList.add('fa-chevron-down');
                    }
                }
            }
        }

        // 选择选项功能 (保持原逻辑，确保HTML中的onclick生效)
        function selectOption(type, value) {
            let inputId;
            switch(type) {
                case 'textType': inputId = 'textTypeInput'; break;
                case 'writingStyle': inputId = 'writingStyleInput'; break;
                case 'audience': inputId = 'audienceInput'; break;
                default: console.error('未知的选项类型:', type); return;
            }
            
            const input = document.getElementById(inputId);
            if (input) {
                input.value = value;
                // 添加一个短暂的视觉反馈
                input.style.borderColor = '#e63e34';
                input.style.boxShadow = '0 0 0 3px rgba(230, 62, 52, 0.1)';
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.style.boxShadow = '';
                }, 500);
            }
        }

        // 前往翻译功能 (核心修复：补全字段 + Mock 兜底)
        async function goToTranslate() {
            const goToTranslateBtn = document.getElementById('goToTranslateBtn');
            if (!goToTranslateBtn) return;

            try {
                // UI 状态
                goToTranslateBtn.disabled = true;
                goToTranslateBtn.textContent = '创建模板中...';
                goToTranslateBtn.classList.add('opacity-50');

                // 【核心修复】完整构建 templateData 对象，防止后端接收空数据
                const templateData = {
                    templateName: `民俗音乐模板_${Date.now()}`,
                    // 严格匹配 HTML 中的 value 属性或 ID
                    era: document.querySelector('input[value="宋代"]')?.value || '宋代',
                    author: document.querySelector('input[value="长江流域"]')?.value || '长江流域',
                    textType: document.getElementById('textTypeInput')?.value || '',
                    style: document.getElementById('writingStyleInput')?.value || '',
                    purpose: document.querySelector('input[value="文化遗产介绍"]')?.value || '文化遗产介绍',
                    audience: document.getElementById('audienceInput')?.value || '国际友人',
                    translatorRole: document.querySelector('input[value="文化翻译专家"]')?.value || '文化翻译专家',
                    // 页面上可能没有 scene 字段输入框，保留默认
                    scene: '音乐文化翻译场景',
                    customRules: document.querySelector('textarea')?.value || ''
                };

                // 调用 Template API
                const token = localStorage.getItem('hxytt_token');
                const response = await fetch('/api/template/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify(templateData)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                if (result.code === 1000 && result.data) {
                    localStorage.setItem('templateId_民俗音乐', result.data);
                    window.location.href = '../翻译页面/translation_page.html';
                } else {
                    throw new Error(result.msg || '创建失败');
                }

            } catch (error) {
                console.warn('API调用失败或无后端，启用模拟跳转:', error);
                
                // 【核心修复】无后端时的兜底逻辑
                setTimeout(() => {
                    localStorage.setItem('templateId_民俗音乐', 'mock-template-id-yinyue');
                    window.location.href = '../翻译页面/translation_page.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
