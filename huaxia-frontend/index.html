    <!-- 自定义Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e63e34', // 有道红色
                        secondary: '#f5f5f5', // 浅灰色背景
                        dark: '#333333', // 深色文本
                        light: '#f9f9f9', // 浅色背景
                        // 朱砂红/赤色背景

                        // 深褐色

                        // 牙白

                        // 青绿色
                        teal: "#00A680",

    <!-- 外部样式文件 -->
    <link rel="stylesheet" href="/mainpage/style.css">
    
    <!-- AI助手自定义样式 -->
    <style>
        /* AI助手浮动按钮动画 */
        #aiAssistantBtn button {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* AI助手侧边抽屉 */
        #aiAssistantDrawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 400px;
            background: white;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        #aiAssistantDrawer.open {
            transform: translateX(0);
        }
        
        /* 遮罩层 */
        #aiAssistantOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
            z-index: 999;
        }
        
        #aiAssistantOverlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* 聊天消息动画 */
        .ai-message {
            animation: messageSlide 0.3s ease-out;
        }
        
        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 滚动条样式 */
        #aiChatList::-webkit-scrollbar {
            width: 4px;
        }
        
        #aiChatList::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 2px;
        }
        
        #aiChatList::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 2px;
        }
        
        #aiChatList::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 响应式 */
        @media (max-width: 640px) {
            #aiAssistantDrawer {
                width: 100%;
            }
        }
    </style>
